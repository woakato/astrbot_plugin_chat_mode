name: astrbot_plugin_chat_mode
display_name: 日常/角色扮演双模式切换
author: woakato
version: 1.8.2
desc: 日常聊天 / 实景角色扮演双模式切换。按会话切换表达方式（括号动作解锁或禁用），隔离两种模式的对话历史，并清洗长期记忆召回中的括号动作风格，防止两种模式的表达方式互相串味。RP 模式下可按概率联动 NAI 生图插件生成场景插图，并可独立控制 TTS 触发频率、语音+文字双输出与剔除括号动作。
short_desc: 按会话切换日常聊天与括号动作实景角色扮演，隔离对话历史与记忆风格，联动 NAI 概率配图，RP 内可控 TTS（频率/双输出/剔除括号）。
repo: https://github.com/woakato/astrbot_plugin_chat_mode
